<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
    <div class="background-overlay"></div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon-box">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2>Portal Admin</h2>
                <p>Silahkan masuk untuk mengelola data siswa</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Masukkan username admin" >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••">
                    </div>
                </div>

                <button class="btn-login" type="submit" onclick="handleLogin()">
                    Masuk Sekarang <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>&copy; 2026 SIAP - Sistem Informasi Administrasi Pelajar</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/login.js"></script>

    <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault()
        handleLogin()
    })

    const scriptURL = 'https://script.google.com/macros/s/AKfycbz3Tz7SXTxXHLuVfrzR_EuI6TOSsB_16SzaHAcgfY-Jp2SscbAT5xwdkYmN4G6sR3b2/exec'
	const form = document.forms['SIAP - Data Siswa']

	form.addEventListener('submit', e => {
		e.preventDefault()
		fetch(scriptURL, { method: 'POST', body: new FormData(form) })
			.then(response => response.json())
			.then(response => console.log('Success!', response))
			.catch(error => console.error('Error!', error.message))
	})
    </script>
</body>
</html>
